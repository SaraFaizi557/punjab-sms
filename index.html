<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" type="image/png" href="/pwa-icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/png" href="/pwa-icon-512.png" sizes="512x512" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B3A6E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#072A52" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Punjab-SMS" />
    <meta name="apple-mobile-web-app-title" content="Punjab-SMS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Punjab-SMS — installable school management on desktop, Android, and iOS" />
    <title>Punjab-SMS</title>
  </head>
  <body>
    <div id="root">
      <!-- Instant paint before JS bundles load (removed when React mounts). -->
      <div id="psms-boot-splash" role="status" aria-live="polite" aria-label="Loading Punjab-SMS" style="position:fixed;inset:0;z-index:2147483646;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F8FAFC;font-family:Montserrat,system-ui,sans-serif">
        <img src="/app-brand-logo.png" alt="" width="192" height="192" style="width:min(52vw,192px);height:auto;object-fit:contain" />
        <div style="margin-top:20px;width:min(200px,72vw)">
          <div style="height:5px;border-radius:999px;background:#E2E8F0;overflow:hidden">
            <div style="height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#047857,#059669 82%,#D4AF37);animation:psms-boot-bar 8s linear forwards"></div>
          </div>
          <div style="margin-top:10px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#64748B">Loading…</div>
        </div>
      </div>
      <style>@keyframes psms-boot-bar{to{width:100%}}@media (prefers-reduced-motion:reduce){#psms-boot-splash [style*="psms-boot-bar"]{animation:none;width:100%!important}}</style>
    </div>
    <!-- Shared cloud settings for every browser/device (written from .env.local). -->
    <script src="/psms-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
